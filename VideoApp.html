<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Frame Navigator</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f1f5f9;
      --panel: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #e2e8f0 0, var(--bg) 40%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      transition: 0.15s ease;
      background: #f8fafc;
    }

    .dropzone.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: #1e3a8a;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button,
    input[type="file"]::file-selector-button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }

    button.primary:hover:enabled { background: var(--primary-hover); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.2rem;
    }

    .viewer {
      display: grid;
      gap: 10px;
      justify-items: center;
    }

    canvas {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f172a;
    }

    .meta {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hidden-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Video Frame Navigator</h1>

    <section id="dropzone" class="dropzone">
      <div>Video per Drag & Drop hier ablegen</div>
      <div>oder</div>
      <input id="fileInput" type="file" accept="video/*" />
    </section>

    <section class="controls">
      <button id="prevBtn" class="primary" disabled>◀ Vorheriger Frame</button>
      <button id="nextBtn" class="primary" disabled>Nächster Frame ▶</button>
    </section>

    <div id="status" class="status">Noch kein Video geladen.</div>

    <section class="viewer">
      <canvas id="frameCanvas" width="1280" height="720" aria-label="Video Frame"></canvas>
      <div id="meta" class="meta">Frame: - / -</div>
    </section>

    <video id="video" class="hidden-video" preload="metadata" playsinline muted></video>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const video = document.getElementById('video');
    const canvas = document.getElementById('frameCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
      objectUrl: null,
      fps: 30,
      frameDuration: 1 / 30,
      currentFrame: 0,
      lastRenderedFrame: -1,
      totalFrames: 0,
      isSeeking: false,
    };

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function updateControls() {
      const hasVideo = Number.isFinite(video.duration) && video.duration > 0;
      prevBtn.disabled = !hasVideo || state.isSeeking || state.currentFrame <= 0;
      nextBtn.disabled = !hasVideo || state.isSeeking || state.currentFrame >= state.totalFrames - 1;
    }

    function updateMeta() {
      if (!state.totalFrames) {
        metaEl.textContent = 'Frame: - / -';
        return;
      }
      metaEl.textContent = `Frame: ${state.currentFrame + 1} / ${state.totalFrames} (≈${state.fps.toFixed(2)} fps)`;
    }

    function cleanupOldUrl() {
      if (state.objectUrl) {
        URL.revokeObjectURL(state.objectUrl);
        state.objectUrl = null;
      }
    }

    function detectFps() {
      const quality = typeof video.getVideoPlaybackQuality === 'function'
        ? video.getVideoPlaybackQuality()
        : null;
      if (quality && quality.totalVideoFrames > 1 && video.duration > 0) {
        const estimated = quality.totalVideoFrames / video.duration;
        if (Number.isFinite(estimated) && estimated > 5 && estimated < 240) {
          return estimated;
        }
      }
      return 30;
    }

    function drawCurrentFrame() {
      const width = video.videoWidth || 1280;
      const height = video.videoHeight || 720;
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      ctx.drawImage(video, 0, 0, width, height);
    }

    async function seekToFrame(targetFrame) {
      if (state.isSeeking || !state.totalFrames) {
        return;
      }

      const clamped = Math.max(0, Math.min(targetFrame, state.totalFrames - 1));
      if (clamped === state.currentFrame) {
        return;
      }

      state.isSeeking = true;
      updateControls();

      const targetTime = Math.min(
        clamped * state.frameDuration,
        Math.max(video.duration - 0.0001, 0)
      );

      await new Promise((resolve, reject) => {
        const onSeeked = () => {
          video.removeEventListener('seeked', onSeeked);
          video.removeEventListener('error', onError);
          resolve();
        };
        const onError = () => {
          video.removeEventListener('seeked', onSeeked);
          video.removeEventListener('error', onError);
          reject(new Error('Seek fehlgeschlagen'));
        };

        video.addEventListener('seeked', onSeeked, { once: true });
        video.addEventListener('error', onError, { once: true });
        video.currentTime = targetTime;
      });

      state.currentFrame = clamped;
      if (state.lastRenderedFrame !== state.currentFrame) {
        drawCurrentFrame();
        state.lastRenderedFrame = state.currentFrame;
      }

      setStatus(`Anzeige: Frame ${state.currentFrame + 1} von ${state.totalFrames}`);
      state.isSeeking = false;
      updateMeta();
      updateControls();
    }

    async function initializeVideo(file) {
      if (!file || !file.type.startsWith('video/')) {
        setStatus('Bitte eine gültige Video-Datei auswählen.');
        return;
      }

      cleanupOldUrl();
      state.objectUrl = URL.createObjectURL(file);
      state.currentFrame = 0;
      state.lastRenderedFrame = -1;
      state.totalFrames = 0;
      state.isSeeking = false;
      updateMeta();
      updateControls();

      setStatus(`Lade: ${file.name}`);

      video.src = state.objectUrl;
      video.load();

      try {
        await new Promise((resolve, reject) => {
          const onLoaded = () => {
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
            resolve();
          };
          const onError = () => {
            video.removeEventListener('loadedmetadata', onLoaded);
            video.removeEventListener('error', onError);
            reject(new Error('Video konnte nicht geladen werden'));
          };
          video.addEventListener('loadedmetadata', onLoaded, { once: true });
          video.addEventListener('error', onError, { once: true });
        });

        state.fps = detectFps();
        state.frameDuration = 1 / state.fps;
        state.totalFrames = Math.max(1, Math.floor(video.duration * state.fps));

        await new Promise((resolve) => {
          const onSeeked = () => {
            video.removeEventListener('seeked', onSeeked);
            resolve();
          };
          video.addEventListener('seeked', onSeeked, { once: true });
          video.currentTime = 0;
        });

        drawCurrentFrame();
        state.currentFrame = 0;
        state.lastRenderedFrame = 0;

        setStatus(`Video geladen: ${file.name}`);
        updateMeta();
        updateControls();
      } catch (error) {
        setStatus(error.message);
        updateControls();
      }
    }

    prevBtn.addEventListener('click', () => seekToFrame(state.currentFrame - 1));
    nextBtn.addEventListener('click', () => seekToFrame(state.currentFrame + 1));

    fileInput.addEventListener('change', (event) => {
      const [file] = event.target.files;
      initializeVideo(file);
    });

    ['dragenter', 'dragover'].forEach((type) => {
      dropzone.addEventListener(type, (event) => {
        event.preventDefault();
        event.stopPropagation();
        dropzone.classList.add('active');
      });
    });

    ['dragleave', 'drop'].forEach((type) => {
      dropzone.addEventListener(type, (event) => {
        event.preventDefault();
        event.stopPropagation();
        dropzone.classList.remove('active');
      });
    });

    dropzone.addEventListener('drop', (event) => {
      const [file] = event.dataTransfer.files;
      initializeVideo(file);
    });

    window.addEventListener('beforeunload', cleanupOldUrl);

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '24px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Kein Video geladen', canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
